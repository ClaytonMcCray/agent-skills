[project]
name = "agent-skills"
version = "0.1.0"
description = "Multi-machine source of truth for agent skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["shared", ".*", "*.egg", "build", "dist", "node_modules", "venv"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["shared/*/scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["UP007"]
